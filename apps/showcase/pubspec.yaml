name: zouriel_ui_showcase
description: Showcase for the zouriel_ui Flutter library.
publish_to: none
# The build number is the Android versionCode. It starts above every APK built before the fixed
# release key (split APKs had codes up to 4001), so an update is never refused as a downgrade.
version: 0.47.0+5036
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  zouriel_ui:
    path: ../../packages/zouriel_ui
  hugeicons: ^1.2.0
  shared_preferences: ^2.5.0
  flutter_svg: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: false
  assets:
    - assets/logo.svg
    - assets/demo/
