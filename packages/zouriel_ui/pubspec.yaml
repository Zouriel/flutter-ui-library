name: zouriel_ui
description: The @zouriel/ui design system for Flutter. Token-driven components with 15 themes, built on the widgets layer (no Material).
version: 0.41.2
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  flutter_map: 8.3.2
  hugeicons: ^1.2.0
  intl: ^0.20.3
  latlong2: 0.10.1
  pdfrx: ^2.6.5
  video_player: ^2.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  video_player_platform_interface: ^6.9.0

flutter:
  fonts:
    - family: Roboto
      fonts:
        - asset: fonts/Roboto-Regular.ttf
          weight: 400
        - asset: fonts/Roboto-Medium.ttf
          weight: 500
        - asset: fonts/Roboto-SemiBold.ttf
          weight: 600
        - asset: fonts/Roboto-Bold.ttf
          weight: 700
        - asset: fonts/Roboto-RegularItalic.ttf
          style: italic
    - family: JetBrains Mono
      fonts:
        - asset: fonts/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: fonts/JetBrainsMono-Medium.ttf
          weight: 500
        - asset: fonts/JetBrainsMono-SemiBold.ttf
          weight: 600
        - asset: fonts/JetBrainsMono-Bold.ttf
          weight: 700
    - family: Space Grotesk
      fonts:
        - asset: fonts/SpaceGrotesk-Regular.ttf
          weight: 400
        - asset: fonts/SpaceGrotesk-Medium.ttf
          weight: 500
        - asset: fonts/SpaceGrotesk-SemiBold.ttf
          weight: 600
        - asset: fonts/SpaceGrotesk-Bold.ttf
          weight: 700
    - family: Bricolage Grotesque
      fonts:
        - asset: fonts/BricolageGrotesque-Regular.ttf
          weight: 400
        - asset: fonts/BricolageGrotesque-Medium.ttf
          weight: 500
        - asset: fonts/BricolageGrotesque-SemiBold.ttf
          weight: 600
        - asset: fonts/BricolageGrotesque-Bold.ttf
          weight: 700
    - family: Poppins
      fonts:
        - asset: fonts/Poppins-Regular.ttf
          weight: 400
        - asset: fonts/Poppins-Medium.ttf
          weight: 500
        - asset: fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: fonts/Poppins-Bold.ttf
          weight: 700
